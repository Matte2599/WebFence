name: Qt desktop

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: '1'
  CGO_CXXFLAGS: '-O2 -g -std=c++17'
  QT_QPA_PLATFORM: offscreen

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Linux Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config qt6-base-dev dbus-x11 gnome-keyring libglib2.0-bin ripgrep
      - name: macOS Qt dependencies
        if: runner.os == 'macOS'
        run: brew install qtbase pkgconf cmake ninja molten-vk vulkan-headers
      - name: macOS development binding flags
        if: runner.os == 'macOS'
        run: echo 'CGO_CXXFLAGS=-O0 -g0 -std=c++17' >> "$GITHUB_ENV"
      - run: test "$(go env GOARCH)" = "${{ matrix.arch }}"
      - name: Source material collector regressions
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go mod download && go mod verify
      - run: go test -race ./internal/demo ./internal/i18n ./internal/preferences ./internal/scope ./internal/transport ./internal/foundation ./internal/signature ./internal/credentials
      - name: Isolated Linux native credential tests
        if: runner.os == 'Linux'
        run: sh scripts/test-keychain-linux.sh
      - name: Private macOS keychain tests
        if: runner.os == 'macOS'
        run: go test -race -tags=keychainintegration ./internal/credentials -count=1 -v
      - name: Bounded scope fuzzing
        if: matrix.os == 'ubuntu-24.04'
        run: go test ./internal/scope -run '^$' -fuzz '^FuzzCheck$' -fuzztime=10s -parallel=2
      - name: Bounded JWS fuzzing
        if: matrix.os == 'ubuntu-24.04'
        run: go test ./internal/signature -run '^$' -fuzz '^FuzzVerify$' -fuzztime=10s -parallel=2
      - run: go build -o bin/webfence ./cmd/webfence
      - run: go vet ./...
      - run: go test ./internal/desktop
      - run: ./bin/webfence --self-test
      - run: ./bin/webfence --soak-test=10s
      - name: macOS development bundle
        if: runner.os == 'macOS'
        run: sh scripts/package-macos.sh
      - name: macOS Cocoa bundle regression
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: cocoa
        run: |
          ./dist/WebFence.app/Contents/MacOS/webfence --self-test
          ./dist/WebFence.app/Contents/MacOS/webfence --soak-test=10s

  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-python
      - run: test "$(go env GOARCH)" = amd64
      - name: Source material collector regressions
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - run: go mod download && go mod verify
      - run: go test -race ./internal/demo ./internal/i18n ./internal/preferences ./internal/scope ./internal/transport ./internal/foundation ./internal/signature ./internal/credentials
      - name: Windows native credential tests
        run: go test -race -tags=keychainintegration ./internal/credentials -count=1 -v
      - run: go build -ldflags '-H=windowsgui -s -w' -o bin/webfence.exe ./cmd/webfence
      - run: go vet ./...
      - run: go test ./internal/desktop
      - run: ./bin/webfence.exe --self-test
      - run: ./bin/webfence.exe --soak-test=10s
      - name: Windows development ZIP
        run: python3 scripts/package-windows.py "$(cygpath -w /ucrt64)" "$(cygpath -w "$PWD/bin/webfence.exe")"
      - name: Windows package without the toolchain on PATH
        shell: pwsh
        run: ./scripts/test-windows-package.ps1 -Archive ./dist/webfence-windows-amd64.zip

  debian-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build and test Debian package in a clean runtime
        run: >-
          docker build --progress=plain --file packaging/debian/Dockerfile
          --build-arg SOURCE_REVISION="$GITHUB_SHA" --build-arg SOURCE_DIRTY=false
          --output type=local,dest=dist/debian-${{ matrix.arch }} .
      - name: Inspect runtime checks
        run: |
          cat dist/debian-${{ matrix.arch }}/validation.txt
          cat dist/debian-${{ matrix.arch }}/SHA256SUMS
