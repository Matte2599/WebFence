name: Qt desktop

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: '1'
  CGO_CXXFLAGS: '-O2 -g -std=c++17'
  QT_QPA_PLATFORM: offscreen

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Linux Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config qt6-base-dev
      - name: macOS Qt dependencies
        if: runner.os == 'macOS'
        run: brew install qtbase pkgconf
      - name: macOS development binding flags
        if: runner.os == 'macOS'
        run: echo 'CGO_CXXFLAGS=-O0 -g0 -std=c++17' >> "$GITHUB_ENV"
      - run: test "$(go env GOARCH)" = "${{ matrix.arch }}"
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go mod download && go mod verify
      - run: go test -race ./internal/demo ./internal/i18n ./internal/preferences ./internal/scope
      - name: Bounded scope fuzzing
        if: matrix.os == 'ubuntu-24.04'
        run: go test ./internal/scope -run '^$' -fuzz '^FuzzCheck$' -fuzztime=10s -parallel=2
      - run: go build -o bin/webfence ./cmd/webfence
      - run: go vet ./...
      - run: ./bin/webfence --self-test
      - name: macOS development bundle
        if: runner.os == 'macOS'
        run: sh scripts/package-macos.sh

  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
      - run: test "$(go env GOARCH)" = amd64
      - run: go mod download && go mod verify
      - run: go test -race ./internal/demo ./internal/i18n ./internal/preferences ./internal/scope
      - run: go build -o bin/webfence.exe ./cmd/webfence
      - run: go vet ./...
      - run: ./bin/webfence.exe --self-test
