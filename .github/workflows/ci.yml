name: Go desktop prototype

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go mod verify
      - run: go vet -tags ci ./...
      - run: go test -tags ci -race ./...

  native-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: windows-2022
            arch: amd64
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Verify architecture
        run: test "$(go env GOARCH)" = "${{ matrix.arch }}"
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev
      - name: Windows C compiler
        if: runner.os == 'Windows'
        run: echo 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"
      - name: Build desktop
        env:
          CGO_ENABLED: '1'
        run: go build -trimpath -o bin/ ./cmd/webfence
      - name: macOS development bundle
        if: runner.os == 'macOS'
        run: sh scripts/package-macos.sh
