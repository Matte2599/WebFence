name: Qt desktop

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: '1'
  CGO_CXXFLAGS: '-O2 -g -std=c++17'
  QT_QPA_PLATFORM: offscreen

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-26
            arch: arm64
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Scope Go cache to runner image
        # macOS 15 and 26 share setup-go's OS/arch key but use different SDKs.
        run: printf '%s\n' '${{ matrix.os }} ${{ matrix.arch }}' > .github/go-cache-target
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .github/go-cache-target
      - name: Remove temporary cache discriminator
        run: rm .github/go-cache-target
      - name: Linux Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config qt6-base-dev dbus-x11 gnome-keyring libglib2.0-bin ripgrep
      - name: macOS Qt dependencies
        if: runner.os == 'macOS'
        run: |
          brew list --versions glib || true
          # Runner formula metadata can also predate the reviewed source plan.
          brew update
          # A preinstalled older GLib can satisfy Qt's dependency without being
          # upgraded. Request it explicitly; the reviewed recipe hash still gates packaging.
          env -u HOMEBREW_NO_INSTALL_UPGRADE brew install qtbase pkgconf cmake ninja molten-vk vulkan-headers glib
          brew list --versions glib libb2
      - name: macOS development binding flags
        if: runner.os == 'macOS'
        run: echo 'CGO_CXXFLAGS=-O0 -g0 -std=c++17' >> "$GITHUB_ENV"
      - run: test "$(go env GOARCH)" = "${{ matrix.arch }}"
      - name: Source collection and attachment regressions
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go mod download && go mod verify
      - run: go test -race ./internal/demo ./internal/i18n ./internal/preferences ./internal/scope ./internal/project ./internal/storage ./internal/transport ./internal/foundation ./internal/signature ./internal/credentials
      - name: Isolated Linux native credential tests
        if: runner.os == 'Linux'
        run: sh scripts/test-keychain-linux.sh
      - name: Private macOS keychain tests
        if: runner.os == 'macOS'
        run: go test -race -tags=keychainintegration ./internal/credentials -count=1 -v
      - name: Bounded scope fuzzing
        if: matrix.os == 'ubuntu-24.04'
        run: go test ./internal/scope -run '^$' -fuzz '^FuzzCheck$' -fuzztime=10s -parallel=2
      - name: Bounded JWS fuzzing
        if: matrix.os == 'ubuntu-24.04'
        run: go test ./internal/signature -run '^$' -fuzz '^FuzzVerify$' -fuzztime=10s -parallel=2
      - run: go build -o bin/webfence ./cmd/webfence
      - run: go vet ./...
      - run: go test ./internal/desktop
      - run: ./bin/webfence --self-test
      - run: ./bin/webfence --soak-test=10s
      - name: Reuse pinned Qt source for Cocoa builds and trials
        if: runner.os == 'macOS'
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 180 --retry 3 --retry-delay 2 --retry-all-errors \
            https://download.qt.io/official_releases/qt/6.11/6.11.2/submodules/qtbase-everywhere-src-6.11.2.tar.xz \
            --output "$RUNNER_TEMP/qtbase-6.11.2.tar.xz"
          echo "WEBFENCE_QT_SOURCE_ARCHIVE=$RUNNER_TEMP/qtbase-6.11.2.tar.xz" >> "$GITHUB_ENV"
      - name: macOS development bundle
        if: runner.os == 'macOS'
        env:
          WEBFENCE_NATIVE_SUPPLEMENT_PLAN: packaging/macos/homebrew-supplements.json
        run: sh scripts/package-macos.sh
      - name: Verify published macOS dependency closure
        if: runner.os == 'macOS'
        run: python3 scripts/check-macos-linkage.py dist/WebFence.app
      - name: Exercise isolated macOS bundle and observe loaded libraries
        if: runner.os == 'macOS'
        run: python3 scripts/test-macos-bundle-isolated.py dist/WebFence.app
      - name: Verify packaged Homebrew supplements
        if: runner.os == 'macOS'
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('dist/WebFence.app/Contents/Resources/notices')
          materials = root / 'homebrew-supplements'
          record = json.loads((materials / 'attachment.json').read_text())
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          assert record['distribution_ready'] is False and record['corresponding_sources_complete'] is False
          assert sha(root / 'native-build.json') == record['native_build_sha256']
          assert sha(materials / 'native-build.current.json') == record['native_build_sha256']
          assert sha(materials / 'plan.json') == record['plan_sha256']
          for entry in record['files'] + record['installed_recipes']:
              assert sha(materials / entry['path']) == entry['sha256']
          assert record['file_count'] == len(record['files']) == 4
          assert record['supplement_bytes'] == sum(x['size_bytes'] for x in record['files'])
          print('PASS signed bundle supplements: 4 files, 2 recipe hashes, current inventory binding')
          PY
      - name: Verify macOS deployment metadata independently
        if: runner.os == 'macOS'
        run: |
          python3 - <<'PY'
          import json, plistlib, re, subprocess
          from pathlib import Path
          bundle = Path('dist/WebFence.app')
          inventory = json.loads((bundle / 'Contents/Resources/notices/native-build.json').read_text())
          observations = []
          for item in inventory['files']:
              text = subprocess.check_output(['xcrun', 'vtool', '-show-build', str(bundle / item['path'])], text=True)
              values = re.findall(r'^\s*minos (\S+)\s*$', text, flags=re.M)
              if not values and 'LC_VERSION_MIN_MACOSX' in text:
                  values = re.findall(r'^\s*version (\S+)\s*$', text, flags=re.M)
              assert len(values) == 1, item['path']
              parts = tuple(int(x) for x in values[0].split('.'))
              parts += (0,) * (3 - len(parts))
              observed = '.'.join(str(x) for x in parts)
              assert observed == item['minimum_macos']['minimum'], item['path']
              observations.append((parts, item['path']))
          required = max(value for value, _ in observations)
          required_text = '.'.join(str(x) for x in required)
          declared = plistlib.loads((bundle / 'Contents/Info.plist').read_bytes())['LSMinimumSystemVersion']
          assert tuple(int(x) for x in declared.split('.')) >= required
          assert inventory['macos_minimum']['bundle_declaration'] == declared
          assert inventory['macos_minimum']['mach_o_requirement'] == required_text
          assert inventory['macos_minimum']['limiting_files'] == sorted(path for value, path in observations if value == required)
          print(f'PASS macOS minimum: plist {declared}, {len(observations)} Mach-O files independently checked with vtool, binary floor {required_text}')
          PY
      - name: macOS Cocoa bundle regression
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: cocoa
        run: |
          ./dist/WebFence.app/Contents/MacOS/webfence --self-test
          ./dist/WebFence.app/Contents/MacOS/webfence --soak-test=10s
      - name: Verify Cocoa AX row filtering (M0-01 reader trials open)
        if: runner.os == 'macOS'
        run: |
          swiftc scripts/test-macos-ax-reset.swift -o "$RUNNER_TEMP/webfence-ax-reset"
          "$RUNNER_TEMP/webfence-ax-reset" dist/WebFence.app
      - name: Rebuild and replace Cocoa using packaged materials
        if: runner.os == 'macOS'
        run: |
          python3 dist/WebFence.app/Contents/Resources/notices/scripts/test-qt-cocoa-replacement.py \
            dist/WebFence.app "$(brew --prefix qtbase)" "$RUNNER_TEMP/cocoa-replacement-trial" || {
              tail -n 60 "$RUNNER_TEMP/cocoa-replacement-trial/"*.log
              exit 1
            }
          cat "$RUNNER_TEMP/cocoa-replacement-trial/result.json"
      - name: Assemble native macOS sources beside the signed bundle
        if: runner.os == 'macOS'
        run: |
          python3 scripts/collect-native-sources.py \
            dist/WebFence.app/Contents/Resources/notices/native-build.json "$RUNNER_TEMP/macos-source-materials"
          python3 scripts/package-macos-sources.py \
            dist/WebFence.app "$RUNNER_TEMP/macos-source-materials" dist/WebFence-native-sources.zip
          unzip -tq dist/WebFence-native-sources.zip
          python3 - <<'PY'
          import json, zipfile
          with zipfile.ZipFile('dist/WebFence-native-sources.zip') as source:
              record = json.loads(source.read('WebFence-native-sources/source-package.json'))
              assert record['distribution_ready'] is False and record['corresponding_sources_complete'] is False
              assert record['archive_count'] == 15 and record['notice_count'] == 258
              assert record['supplement_file_count'] == 4 and len(record['signed_bundle_files']) == 28
              print('PASS native source ZIP: 15 archives, 258 notices, 4 supplements, 28 signed binary identities')
          PY

  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          path-type: inherit
          # This action runs pacman -Scc after saving its cache. Keep downloaded
          # packages available for DLL/BUILDINFO provenance verification.
          cache: false
          update: true
          install: >-
            gnupg
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-python
      - run: test "$(go env GOARCH)" = amd64
      - name: Source collection and attachment regressions
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - run: go mod download && go mod verify
      - run: go test -race ./internal/demo ./internal/i18n ./internal/preferences ./internal/scope ./internal/project ./internal/storage ./internal/transport ./internal/foundation ./internal/signature ./internal/credentials
      - name: Windows native credential tests
        run: go test -race -tags=keychainintegration ./internal/credentials -count=1 -v
      - run: go build -ldflags '-H=windowsgui -s -w' -o bin/webfence.exe ./cmd/webfence
      - run: go vet ./...
      - run: go test ./internal/desktop
      - run: ./bin/webfence.exe --self-test
      - run: ./bin/webfence.exe --soak-test=10s
      - name: Windows development ZIP
        run: >-
          python3 scripts/package-windows.py "$(cygpath -w /ucrt64)" "$(cygpath -w "$PWD/bin/webfence.exe")"
          --collect-sources "$RUNNER_TEMP/webfence-msys2-sources"
      - name: Failed source attachment preserves the previous Windows ZIP
        run: |
          previous_hash=$(sha256sum dist/webfence-windows-amd64.zip)
          touch "$RUNNER_TEMP/webfence-msys2-sources/INCOMPLETE"
          trap 'rm -f "$RUNNER_TEMP/webfence-msys2-sources/INCOMPLETE"' EXIT
          if python3 scripts/package-windows.py "$(cygpath -w /ucrt64)" "$(cygpath -w "$PWD/bin/webfence.exe")" \
              --source-materials "$RUNNER_TEMP/webfence-msys2-sources" > "$RUNNER_TEMP/webfence-source-failure.log" 2>&1; then
            echo 'Incomplete source collection unexpectedly accepted'
            exit 1
          fi
          grep -F 'Windows source collection is incomplete' "$RUNNER_TEMP/webfence-source-failure.log"
          test "$previous_hash" = "$(sha256sum dist/webfence-windows-amd64.zip)"
          echo 'PASS failed source attachment preserves the previous Windows ZIP'
      - name: Windows package without the toolchain on PATH
        shell: pwsh
        run: ./scripts/test-windows-package.ps1 -Archive ./dist/webfence-windows-amd64.zip -RequireSources

  debian-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build and test Debian package in a clean runtime
        run: >-
          docker build --progress=plain --file packaging/debian/Dockerfile
          --build-arg SOURCE_REVISION="$GITHUB_SHA" --build-arg SOURCE_DIRTY=false
          --output type=local,dest=dist/debian-${{ matrix.arch }} .
      - name: Inspect runtime checks
        run: |
          cat dist/debian-${{ matrix.arch }}/validation.txt
          cat dist/debian-${{ matrix.arch }}/SHA256SUMS
